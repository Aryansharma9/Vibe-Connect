services:
  postgres:
    image: postgres:16-alpine
    container_name: vibeconnect_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vibeconnect
      POSTGRES_USER: vibeuser
      POSTGRES_PASSWORD: vibepassword
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: vibeconnect_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

volumes:
  pgdata:
  redisdata:

